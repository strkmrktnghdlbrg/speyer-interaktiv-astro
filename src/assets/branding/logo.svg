  </g>
  <!-- Wordmark -->
  <text x="64" y="36" fill="currentColor" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    Speyer<tspan font-weight="400" opacity="0.7">-Interaktiv</tspan>
  </text>
  <text x="64" y="52" fill="currentColor" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="3" opacity="0.6">DAS STADTPORTAL</text>
