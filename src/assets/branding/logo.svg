    <!-- Linker Westturm -->
    <path d="M10 26 L18 26 L18 20 L20 20 L20 16 L8 16 L8 20 L10 20 Z M10 26 L10 50 L18 50 L18 26 Z"/>
    <!-- Rechter Westturm -->
    <path d="M40 26 L48 26 L48 20 L50 20 L50 16 L38 16 L38 20 L40 20 Z M40 26 L40 50 L48 50 L48 26 Z"/>
